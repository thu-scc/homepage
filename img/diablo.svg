<svg viewBox="0 0 100 130" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 渐变红：从亮血红到暗深红 -->
    <linearGradient id="red-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff3333"/>
      <stop offset="40%" stop-color="#cc1a1a"/>
      <stop offset="100%" stop-color="#6b0f0f"/>
    </linearGradient>
    <!-- 光晕 -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g fill="none" stroke="url(#red-glow)" stroke-width="1.3" stroke-linejoin="miter" filter="url(#glow)">
    <!-- Top central triangle -->
    <path d="M50,18 L38,45 L62,45 Z"/>
    <!-- Central vertical line -->
    <line x1="50" y1="18" x2="50" y2="92"/>
    <!-- Left horn -->
    <path d="M23,22 L28,25 L26,30 L20,28 Z"/>
    <path d="M28,25 L30,32 L27,35"/>
    <!-- Right horn -->
    <path d="M77,22 L72,25 L74,30 L80,28 Z"/>
    <path d="M72,25 L70,32 L73,35"/>
    <!-- Left face -->
    <path d="M27,35 L38,45 L42,58 L24,48 Z"/>
    <path d="M24,48 L42,58 L44,70 L32,62 Z"/>
    <!-- Right face -->
    <path d="M73,35 L62,45 L58,58 L76,48 Z"/>
    <path d="M76,48 L58,58 L56,70 L68,62 Z"/>
    <!-- Lower chevron -->
    <path d="M32,62 L44,70 L50,92 L36,72 Z"/>
    <path d="M68,62 L56,70 L50,92 L64,72 Z"/>
    <path d="M36,72 L50,92 L64,72"/>
    <path d="M44,70 L50,78 L56,70"/>
  </g>

  <!-- DIABLO text -->
  <text x="50" y="108" text-anchor="middle"
        font-family="'Orbitron','Rajdhani',sans-serif" font-size="7"
        font-weight="700" letter-spacing="3"
        fill="url(#red-glow)">DIABLO</text>
</svg>
