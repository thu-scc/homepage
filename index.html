<!-- ============ Home Page Template (inline, always available) ============ -->
<template id="tpl-home">
  <section class="hero">
    <p class="hero-kicker">Tsinghua Student Cluster Competition Team</p>
    <h1 class="hero-title">清华大学<br>学生超算团队</h1>
    <p class="hero-sub">让超算技术走出竞赛场，走进科研现场。<br>用高性能计算、AI 系统和分布式架构，为科研团队解决真实的计算瓶颈。</p>
    <div class="hero-stats">
      <div class="hero-stat"><span class="n">14+</span><span class="l">国际赛事冠军</span></div>
      <div class="hero-stat"><span class="n">13</span><span class="l">年竞赛历程</span></div>

    </div>

    <h2 class="sec-title">了解我们</h2>
    <div class="cards">
      <div class="card" onclick="go('collaboration')"><p class="card-tag">Cross-disciplinary</p><h3 class="card-title">交叉合作</h3><p class="card-desc">天格计划 · 化工系 LEB · 以超算技术服务科研一线</p></div>

    </div>
  </section>
